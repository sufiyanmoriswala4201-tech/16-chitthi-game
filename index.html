<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2570f">
<meta name="description" content="Sola Chitthi — N players. N cards. N of a kind wins.">
<title>Sola Chitthi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#faf4ea;
  --bg-grad:radial-gradient(ellipse at top,#fff8ed 0%,#f7eedd 40%,#f2e8d8 100%);
  --fg:#1a1410;
  --fg-2:#4a3d33;
  --mut:#958570;
  --card:#ffffff;
  --acc:#e2570f;
  --acc-2:#c2410c;
  --acc-soft:#ffe4cc;
  --line:#ecdfc7;
  --line-strong:#d9c8a8;
  --shadow-sm:0 1px 2px rgba(60,40,20,.06),0 2px 4px rgba(60,40,20,.04);
  --shadow-md:0 4px 12px rgba(60,40,20,.08),0 2px 6px rgba(60,40,20,.04);
  --shadow-lg:0 20px 50px -10px rgba(60,40,20,.25),0 10px 20px -5px rgba(60,40,20,.1);
  --radius:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14100c;
    --bg-grad:radial-gradient(ellipse at top,#221a13 0%,#14100c 60%);
    --fg:#f7ecdb;
    --fg-2:#d4c3a8;
    --mut:#9a8a72;
    --card:#211a13;
    --acc:#fb923c;
    --acc-2:#f97316;
    --acc-soft:#3a2416;
    --line:#3a2e21;
    --line-strong:#4a3a28;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 12px rgba(0,0,0,.4);
    --shadow-lg:0 20px 50px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}

html,body{
  min-height:100%;
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--fg);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.5;
}

main{max-width:460px;margin:0 auto;padding:28px 20px 48px;min-height:100vh}

/* Logo */
.logo-mark{
  width:60px;height:56px;margin:0 auto 8px;position:relative;
}
.logo-mark span{
  position:absolute;width:36px;height:48px;border-radius:7px;
  border:2.5px solid var(--acc-2);
}
.logo-mark span:first-child{
  background:var(--card);left:0;top:4px;transform:rotate(-10deg);
}
.logo-mark span:last-child{
  background:color-mix(in srgb,var(--acc) 25%,var(--card));
  right:0;top:4px;transform:rotate(10deg);
}

h1{
  font-size:32px;font-weight:800;letter-spacing:-0.025em;
  text-align:center;margin:4px 0 4px;
}
.sub{
  text-align:center;color:var(--mut);font-size:14px;font-weight:500;
  margin-bottom:20px;letter-spacing:0.01em;
}

/* Panels */
.panel{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;margin-bottom:14px;
  box-shadow:var(--shadow-md);
}

/* Inputs */
label{
  display:block;font-size:13px;font-weight:600;color:var(--fg-2);
  margin:0 0 8px;letter-spacing:0.01em;
}
input{
  width:100%;padding:13px 15px;font-size:16px;font-family:inherit;
  font-weight:500;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--fg);
  transition:border-color .15s,box-shadow .15s;outline:none;
}
input:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent);
}
input::placeholder{color:var(--mut);font-weight:400}

/* Buttons */
.big,.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-weight:700;border:0;cursor:pointer;
  transition:transform .12s,box-shadow .2s,background .2s,opacity .2s;
  user-select:none;
}
.big{
  width:100%;padding:15px 20px;margin-top:12px;font-size:16px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
  color:#fff;
  box-shadow:0 4px 14px -2px color-mix(in srgb,var(--acc) 45%,transparent),0 2px 4px color-mix(in srgb,var(--acc) 20%,transparent);
}
.big:hover:not(:disabled){
  box-shadow:0 8px 20px -4px color-mix(in srgb,var(--acc) 55%,transparent),0 4px 8px color-mix(in srgb,var(--acc) 25%,transparent);
}
.big:active:not(:disabled){
  transform:translateY(1px);
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--acc) 45%,transparent);
}
.big:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* Divider */
.divider{
  display:flex;align-items:center;gap:12px;margin:20px 0 14px;
  color:var(--mut);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.12em;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:var(--line);
}

/* Join row */
.row{display:flex;gap:10px}
.row input{
  flex:1;text-align:center;font-weight:800;letter-spacing:0.25em;
  font-size:18px;text-transform:uppercase;padding:13px 12px;
}
.row .big{
  width:auto;margin-top:0;padding:13px 24px;flex-shrink:0;
  font-size:15px;letter-spacing:0.01em;
}

/* Room code */
.code{
  font-size:44px;font-weight:800;letter-spacing:0.22em;text-align:center;
  color:var(--acc);margin:6px 0 4px;
  font-variant-numeric:tabular-nums;text-indent:0.22em;
}

/* Player list */
#pl{list-style:none;margin:16px 0 0}
#pl li{
  padding:13px 16px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:8px;background:var(--bg);font-weight:600;font-size:15px;
  color:var(--fg);
}

/* Rules */
.rules-info{
  font-size:13px;line-height:1.6;color:var(--mut);text-align:center;
  margin:16px 0 4px;padding:14px;background:var(--bg);
  border-radius:12px;border:1px dashed var(--line-strong);
}
.rules-info b{color:var(--fg-2);font-weight:700}

/* Player strip */
.strip{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin-bottom:14px;
}
.pl{
  border:2px solid var(--line);border-radius:14px;padding:9px 12px;
  font-size:12px;background:var(--card);text-align:center;
  font-weight:500;color:var(--mut);
  transition:border-color .2s,box-shadow .2s,transform .2s;
  min-width:80px;box-shadow:var(--shadow-sm);
}
.pl b{
  display:block;font-size:13px;font-weight:700;margin-bottom:2px;
  color:var(--fg);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100px;
}
.pl.on{
  border-color:var(--acc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent),var(--shadow-md);
  transform:translateY(-2px);color:var(--acc);
}

/* Status */
.log{
  min-height:48px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:15px;font-weight:600;margin:6px 0 12px;
  color:var(--fg-2);padding:0 8px;line-height:1.4;
}

/* Table */
.table{
  position:relative;width:100%;aspect-ratio:400/340;
  border:2px dashed var(--line-strong);border-radius:20px;
  background:
    radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--acc) 7%,transparent) 0%,transparent 60%),
    var(--card);
  overflow:hidden;margin-bottom:14px;
  box-shadow:inset 0 2px 8px rgba(60,40,20,.04),var(--shadow-sm);
}
.fold{
  position:absolute;padding:0;border:0;border-radius:4px;
  background:linear-gradient(135deg,#f8ecd0 0%,#f0dfb8 100%);
  box-shadow:0 2px 0 rgba(120,90,50,.25),0 3px 6px rgba(120,90,50,.12);
  transition:all .7s cubic-bezier(.34,1.2,.4,1);cursor:pointer;
}
.fold::after{
  content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;
  background:rgba(180,140,80,.35);border-radius:2px;
}
.fold:hover{
  box-shadow:0 3px 0 rgba(120,90,50,.3),0 6px 12px rgba(120,90,50,.2);
}

/* Hand */
.me{
  background:var(--card);border:2px solid var(--line);
  border-radius:18px;padding:18px 14px 16px;
  transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow-sm);
}
.me.on{
  border-color:var(--acc);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 12%,transparent),var(--shadow-md);
}
.me h2{
  margin:0 0 14px;font-size:11px;font-weight:800;text-align:center;
  color:var(--mut);text-transform:uppercase;letter-spacing:0.14em;
}
.hand{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  min-height:70px;
}

/* Chit card */
.chit{
  min-width:76px;padding:16px 12px;border-radius:9px;
  font-size:15px;font-weight:800;font-family:inherit;border:0;
  color:#2b2118;
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12);
  transform:rotate(-1.5deg);cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.chit::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,transparent 40%);
  pointer-events:none;
}
.chit:nth-child(even){transform:rotate(1.5deg)}
.chit:disabled{opacity:.5;cursor:default;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.chit:not(:disabled):hover{
  transform:translateY(-3px) rotate(0deg);
  box-shadow:0 6px 0 rgba(0,0,0,.14),0 12px 22px rgba(0,0,0,.18);
}
.chit:not(:disabled):active{
  transform:translateY(0) scale(.95);
  box-shadow:0 2px 0 rgba(0,0,0,.15);
}

/* Win overlay */
.over{
  position:fixed;inset:0;background:rgba(20,15,10,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:100;animation:fadeIn .3s ease;
}
.over .panel{
  text-align:center;max-width:340px;width:100%;margin:0;
  padding:32px 24px 24px;box-shadow:var(--shadow-lg);
  animation:popIn .45s cubic-bezier(.2,1.2,.4,1);
}
.over h2{
  font-size:28px;font-weight:800;margin:0 0 4px;
  letter-spacing:-0.02em;color:var(--fg);
}
#od{
  color:var(--mut);font-size:15px;font-weight:500;
  margin:8px 0 22px;line-height:1.5;
}

/* Message */
.msg{
  text-align:center;color:var(--acc);font-size:14px;font-weight:700;
  min-height:22px;padding:0 12px;margin-top:12px;
}

.hide{display:none !important}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main>
  <div class="logo-mark" aria-hidden="true"><span></span><span></span></div>
  <h1>Sola Chitthi</h1>
  <div class="sub">N players · N cards · N of a kind wins</div>

  <div id="home" class="panel">
    <label for="nm">Your Name</label>
    <input id="nm" maxlength="12" placeholder="Enter your name" autocomplete="nickname">
    <div id="acts">
      <button class="big" id="mk" style="margin-top:16px">Create Room</button>
      <div class="divider"><span>Or join a game</span></div>
      <div class="row">
        <input id="cd" maxlength="4" placeholder="CODE" autocapitalize="characters" spellcheck="false" autocomplete="off">
        <button class="big" id="jn">Join</button>
      </div>
    </div>
  </div>

  <div id="lobby" class="panel hide">
    <div class="sub" style="margin:0 0 6px">Room Code</div>
    <div class="code" id="lc">----</div>
    <div class="sub" style="margin:0;font-size:12px">Share this code with friends</div>
    <ul id="pl"></ul>
    <div id="hostbox" class="hide">
      <div class="rules-info">
        Each player receives <b>N cards</b> with their own name.<br>
        First to collect <b><span id="needN">N</span> matching cards</b> wins!
      </div>
      <button class="big" id="go">Start Game</button>
    </div>
    <div id="wait" class="log hide">Waiting for host to start...</div>
  </div>

  <div id="gm" class="hide">
    <div class="strip" id="strip"></div>
    <div class="log" id="log"></div>
    <div class="table" id="table"></div>
    <button class="big hide" id="scat">Scatter Cards 🎲</button>
    <div class="me" id="me"><h2 id="mh"></h2><div class="hand" id="hand"></div></div>
  </div>

  <div id="over" class="over hide">
    <div class="panel">
      <h2 id="ot"></h2>
      <div id="od"></div>
      <button class="big hide" id="again">Play Again</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
var socket = io();
var uid = localStorage.getItem('uid');
if (!uid) {
  uid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem('uid', uid);
}
var myName = '';
var currentCode = null;
var S = null;
var busy = false;
var els = [], sc = [], tw = { w: 0, h: 0 };

function $(i) { return document.getElementById(i); }
function show(id) { ["home","lobby","gm"].forEach(s => $(s).classList.toggle("hide", s !== id)); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function err(t) { $("msg").textContent = t; setTimeout(() => { $("msg").textContent = ""; }, 4000); }
function pname(u) { return S && S.players[u] ? S.players[u].name : "Player"; }
function colr(v, N) { return "hsl(" + Math.round(v * 360 / N) + ",72%,80%)"; }

$("nm").value = localStorage.getItem('nm') || '';

socket.on('state', (s) => { S = s; currentCode = s.code; render(); });

socket.on('connect', () => {
  if (currentCode && myName) {
    socket.emit('join', { uid, name: myName, code: currentCode }, (res) => {
      if (!res.ok) { currentCode = null; S = null; show("home"); }
    });
  }
});

function nameOk() {
  myName = $("nm").value.trim();
  if (!myName) { err("Please enter your name"); return false; }
  localStorage.setItem('nm', myName); return true;
}
function createGame() {
  if (!nameOk()) return;
  socket.emit('create', { uid, name: myName }, (res) => {
    if (res.ok) currentCode = res.code;
    else err("Couldn't create room");
  });
}
function joinGame() {
  if (!nameOk()) return;
  var c = $("cd").value.trim().toUpperCase();
  if (c.length !== 4) { err("Enter a 4-character room code"); return; }
  socket.emit('join', { uid, name: myName, code: c }, (res) => {
    if (res.ok) currentCode = res.code;
    else err(res.error || "Couldn't join");
  });
}
function startGame() {
  if (!S || S.host !== uid) return;
  if (S.order.length < 2) return;
  socket.emit('start', { uid, code: currentCode });
}
function scatterNow() { socket.emit('scatter', { uid, code: currentCode }); }
function pickChit(i) {
  if (busy || !S || S.phase === 'table') return;
  if (S.stage !== 'pick' || S.pickTurn !== uid || S.taken[i]) return;
  busy = true;
  socket.emit('pick', { uid, code: currentCode, chit: i });
}
function passChit(v) {
  if (busy || !S) return;
  if (S.stage !== 'play' || S.cur !== uid) return;
  busy = true;
  socket.emit('pass', { uid, code: currentCode, v });
}
function rematch() {
  if (!S || S.host !== uid) return;
  socket.emit('rematch', { uid, code: currentCode });
}

function render() {
  busy = false;
  if (!S) { show("home"); return; }
  if (S.phase === 'lobby') { renderLobby(); return; }
  if (!S.order || S.order.indexOf(uid) < 0) { show("home"); err("You're not in this game"); return; }
  show("gm"); renderGame();
}

function renderLobby() {
  show("lobby");
  $("lc").textContent = currentCode;
  var ids = S.order, n = ids.length, isH = S.host === uid;
  $("pl").innerHTML = ids.map(i =>
    "<li>" + esc(S.players[i].name) +
    (i === S.host ? " 👑" : "") +
    (i === uid ? " <span style='color:var(--mut);font-weight:500'>(you)</span>" : "") +
    "</li>"
  ).join("");
  $("hostbox").classList.toggle("hide", !isH);
  $("wait").classList.toggle("hide", isH);
  if (isH) {
    $("needN").textContent = n;
    $("go").disabled = n < 2;
    $("go").textContent = n < 2 ? "Need at least 2 players" : "Start Game (" + n + " players)";
  }
}

function buildTable(N) {
  var t = $("table");
  var w = Math.min(46, Math.floor(Math.sqrt(400 * 340 / (N * N * 1.7))));
  var h = Math.round(w * 0.78);
  var pts = [];
  t.innerHTML = ""; tw = { w: w, h: h }; els = []; sc = [];
  var seed = S.seed;
  function r() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var q = Math.imul(seed ^ seed >>> 15, 1 | seed);
    q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q;
    return ((q ^ q >>> 14) >>> 0) / 4294967296;
  }
  for (var i = 0; i < N * N; i++) {
    var x, y, k = 0, ok;
    do {
      x = r() * (400 - w); y = r() * (340 - h);
      ok = pts.every(q => Math.abs(q[0] - x) > w + 2 || Math.abs(q[1] - y) > h + 2);
      k++;
    } while (!ok && k < 60);
    pts.push([x, y]); sc.push({ x: x, y: y, a: r() * 120 - 60 });
    var el = document.createElement("button");
    el.className = "fold"; el.style.transition = "none";
    el.style.width = (w / 4) + "%"; el.style.height = (h / 3.4) + "%";
    el.onclick = (function(j) { return function() { pickChit(j); }; })(i);
    t.appendChild(el); els.push(el);
  }
  t.dataset.k = S.seed + "-" + N;
  setTimeout(() => els.forEach(e => e.style.transition = ""), 80);
}

function placeTable() {
  var st = S.phase === 'table';
  els.forEach((el, i) => {
    var p = sc[i];
    if (st) {
      el.style.left = ((200 - tw.w / 2) / 4) + "%";
      el.style.top = ((170 - tw.h / 2) / 3.4) + "%";
      el.style.transform = "rotate(" + (p.a / 4) + "deg)";
    } else {
      el.style.left = (p.x / 4) + "%";
      el.style.top = (p.y / 3.4) + "%";
      el.style.transform = "rotate(" + p.a + "deg)";
    }
    var tk = S.taken[i];
    el.style.opacity = tk ? "0" : "1";
    el.style.pointerEvents = (tk || st) ? "none" : "auto";
  });
}

function renderGame() {
  var N = S.order.length, t = $("table");
  if (t.dataset.k !== S.seed + "-" + N) buildTable(N);
  placeTable();
  var turnU = S.stage === 'pick' ? S.pickTurn : (S.stage === 'play' ? S.cur : null);
  $("strip").innerHTML = S.order.map(u =>
    "<div class='pl" + (u === turnU ? " on" : "") + "'><b>" + esc(pname(u)) + "</b>" + S.hands[u].length + " cards</div>"
  ).join("");
  var isH = S.host === uid;
  $("scat").classList.toggle("hide", !(S.stage === "table" && isH));
  var mh = $("mh"), lg;
  if (S.stage === "table") {
    lg = isH ? "You're the host — scatter the cards!" : esc(pname(S.host)) + " is scattering cards...";
  } else if (S.stage === "pick") {
    lg = S.pickTurn === uid
      ? "Your turn — pick a card from the table (" + (S.hands[uid].length + 1) + "/" + N + ")"
      : esc(pname(S.pickTurn)) + " is picking a card...";
  } else if (S.stage === "play") {
    lg = S.cur === uid
      ? "Your turn — choose a card and pass it to " + esc(pname(S.turnNext))
      : esc(pname(S.cur)) + " is passing a card...";
  } else {
    lg = "Game over";
  }
  $("log").innerHTML = lg;
  var mine = S.stage === "play" && S.cur === uid && !busy;
  $("me").className = "me" + ((mine || (S.stage === "pick" && S.pickTurn === uid)) ? " on" : "");
  mh.textContent = "Your Cards · " + S.hands[uid].length;
  var h = $("hand"); h.innerHTML = "";
  S.hands[uid].slice().sort((a, b) => a - b).forEach(v => {
    var b = document.createElement("button");
    b.className = "chit"; b.textContent = S.names[v];
    b.style.background = colr(v, N); b.disabled = !mine;
    b.onclick = function() { passChit(v); };
    h.appendChild(b);
  });
  var ov = $("over");
  if (S.stage === "done") {
    var w = S.winner;
    $("ot").textContent = w === uid ? "You won! 🎉" : pname(w) + " won!";
    $("od").textContent = "Collected all " + N + " \"" + S.names[S.hands[w][0]] + "\" cards.";
    $("again").classList.toggle("hide", !isH);
    ov.classList.remove("hide");
  } else ov.classList.add("hide");
}

$("mk").onclick = createGame;
$("jn").onclick = joinGame;
$("go").onclick = startGame;
$("scat").onclick = scatterNow;
$("again").onclick = rematch;
</script>
</body>
</html>
